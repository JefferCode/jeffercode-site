<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.2" baseProfile="tiny-ps"
     viewBox="0 0 80 80" width="80" height="80">
  <title>jeffercode</title>
  <!-- Fondo -->
  <rect width="80" height="80" rx="16" fill="#0d1117"/>
  <!-- Borde sutil -->
  <rect x=".75" y=".75" width="78.5" height="78.5" rx="15.25"
        fill="none" stroke="#3fb950" stroke-width="2" stroke-opacity=".3"/>
  <!-- J (dimmed) -->
  <rect x="18" y="18" width="8" height="8" rx="1.5" fill="#3fb950" opacity=".3"/>
  <rect x="28" y="18" width="8" height="8" rx="1.5" fill="#3fb950" opacity=".3"/>
  <rect x="28" y="28" width="8" height="8" rx="1.5" fill="#3fb950" opacity=".3"/>
  <rect x="28" y="38" width="8" height="8" rx="1.5" fill="#3fb950" opacity=".3"/>
  <rect x="18" y="48" width="8" height="8" rx="1.5" fill="#3fb950" opacity=".3"/>
  <rect x="28" y="48" width="8" height="8" rx="1.5" fill="#3fb950" opacity=".3"/>
  <!-- C (bright) -->
  <rect x="42" y="18" width="8" height="8" rx="1.5" fill="#3fb950"/>
  <rect x="52" y="18" width="8" height="8" rx="1.5" fill="#3fb950"/>
  <rect x="42" y="28" width="8" height="8" rx="1.5" fill="#3fb950"/>
  <rect x="42" y="38" width="8" height="8" rx="1.5" fill="#3fb950"/>
  <rect x="42" y="48" width="8" height="8" rx="1.5" fill="#3fb950"/>
  <rect x="52" y="48" width="8" height="8" rx="1.5" fill="#3fb950"/>
</svg>
